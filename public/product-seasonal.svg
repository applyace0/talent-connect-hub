<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06080F"/>
      <stop offset="0.5" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#06080F"/>
    </linearGradient>
    <radialGradient id="spot" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 280) rotate(35) scale(840 620)">
      <stop stop-color="#FACC15" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-60" y="-60" width="1720" height="1120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" rx="56" fill="url(#bg)"/>
  <rect width="1600" height="1000" rx="56" fill="url(#spot)"/>

  <g filter="url(#shadow)">
    <!-- calendar card -->
    <rect x="250" y="300" width="520" height="440" rx="44" fill="#0F172A" stroke="#E2E8F0" stroke-opacity="0.18"/>
    <rect x="250" y="300" width="520" height="78" rx="39" fill="#0B1220"/>
    <circle cx="330" cy="340" r="10" fill="#22D3EE" opacity="0.9"/>
    <circle cx="380" cy="340" r="10" fill="#FACC15" opacity="0.9"/>
    <circle cx="430" cy="340" r="10" fill="#E2E8F0" opacity="0.55"/>

    <!-- calendar grid -->
    <g opacity="0.45">
      <rect x="305" y="420" width="90" height="68" rx="16" fill="#F8FAFC" fill-opacity="0.08"/>
      <rect x="415" y="420" width="90" height="68" rx="16" fill="#FACC15" fill-opacity="0.16"/>
      <rect x="525" y="420" width="90" height="68" rx="16" fill="#F8FAFC" fill-opacity="0.08"/>
      <rect x="635" y="420" width="90" height="68" rx="16" fill="#F8FAFC" fill-opacity="0.08"/>

      <rect x="305" y="504" width="90" height="68" rx="16" fill="#F8FAFC" fill-opacity="0.08"/>
      <rect x="415" y="504" width="90" height="68" rx="16" fill="#F8FAFC" fill-opacity="0.08"/>
      <rect x="525" y="504" width="90" height="68" rx="16" fill="#22D3EE" fill-opacity="0.14"/>
      <rect x="635" y="504" width="90" height="68" rx="16" fill="#F8FAFC" fill-opacity="0.08"/>
    </g>

    <!-- featured pack -->
    <rect x="850" y="360" width="520" height="380" rx="44" fill="#F8FAFC" fill-opacity="0.90" stroke="#E2E8F0" stroke-opacity="0.28"/>
    <path d="M900 660C980 600 1060 600 1140 660C1220 720 1300 720 1320 700" stroke="#0B1220" stroke-opacity="0.14" stroke-width="18" stroke-linecap="round"/>
    <rect x="910" y="418" width="380" height="18" rx="9" fill="#0B1220" opacity="0.12"/>
    <rect x="910" y="454" width="280" height="12" rx="6" fill="#0B1220" opacity="0.10"/>
  </g>

  <!-- confetti -->
  <g opacity="0.35">
    <path d="M1300 170L1324 196" stroke="#FACC15" stroke-width="8" stroke-linecap="round"/>
    <path d="M1246 210L1268 190" stroke="#22D3EE" stroke-width="8" stroke-linecap="round"/>
    <path d="M1188 176L1210 204" stroke="#E2E8F0" stroke-opacity="0.65" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>

